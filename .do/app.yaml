name: remme
region: nyc

workers:
  - name: bot
    github:
      repo: zafandy/remme
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    instance_count: 1
    instance_size_slug: basic-xxs   # 512 MB RAM / 0.5 vCPU — $5/mo

    envs:
      - key: TELEGRAM_BOT_TOKEN
        scope: RUN_TIME
        type: SECRET          # set value in App Platform dashboard, not here
      - key: TELEGRAM_CHAT_ID
        scope: RUN_TIME
        type: SECRET
      - key: HAJIME_CHANNEL_ID
        scope: RUN_TIME
        value: UCdNifcioSBjkXyUTCYMFmqA
      - key: TIMEZONE
        scope: RUN_TIME
        value: Asia/Tashkent
      - key: DB_PATH
        scope: RUN_TIME
        value: /mnt/data/remme.db  # persisted volume mount

    storage:
      - name: data-vol
        mount_path: /mnt/data      # SQLite DB survives redeploys here
